services:
  web:
    container_name: bluefin-ai-fde-web
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL}
    environment:
      SITE_URL: ${SITE_URL}
      DATABASE_PATH: /app/data/bluefin.db
      OPERATIONS_ADMIN_EMAIL: ${OPERATIONS_ADMIN_EMAIL}
      OPERATIONS_ADMIN_PASSWORD: ${OPERATIONS_ADMIN_PASSWORD}
    restart: unless-stopped
    mem_limit: 1g
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - database:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    container_name: bluefin-ai-fde-caddy
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped
    mem_limit: 256m
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  database:
    name: bluefin-ai-fde-data
  caddy_data:
  caddy_config:
